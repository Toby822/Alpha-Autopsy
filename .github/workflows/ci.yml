name: Validate Alpha Autopsy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    name: Python, JavaScript and in-browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Reproduce historical report and test no-lookahead invariants
        run: |
          python -m src.research
          python -m unittest discover -s tests -v
      - name: Compare Python and browser-model calculations
        run: |
          node --check web/engine.js
          node --check web/app.js
          node tests/test_engine.cjs
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser user-interface regression tests
        run: python tests/browser_smoke.py
      - name: Save desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-autopsy-qa
          path: screenshots/*.png
          if-no-files-found: ignore