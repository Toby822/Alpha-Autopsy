name: Publish Alpha Autopsy
on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'web/**'
      - 'research/results.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Static research workbench
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployed research artifact and JavaScript syntax
        run: |
          test -s index.html
          test -s research/results.json
          node --check web/engine.js
          node --check web/app.js
          node tests/test_engine.cjs
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R web research data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public URL (once Pages is activated)
        shell: bash
        run: |
          set -euo pipefail
          url='https://toby822.github.io/Alpha-Autopsy/'
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 15 "$url" -o /tmp/alpha.html && grep -q 'ALPHA AUTOPSY' /tmp/alpha.html; then break; fi
            sleep 3
          done
          grep -q 'ALPHA AUTOPSY' /tmp/alpha.html
          for asset in web/engine.js web/app.js web/style.css research/results.json; do
            curl -fsSL --max-time 15 "$url$asset" -o /dev/null
          done
          echo "Public Alpha Autopsy app and research data are accessible"